name: APK

# Builds the phone version: a single .apk holding CPython, the `app/` package,
# a static ffmpeg and the web UI. It needs no server of any kind at run time.
#
# Two jobs, because the halves have very different costs. ffmpeg takes about
# half an hour and changes only when its build script does, so it is cached and
# the APK job usually starts with it already built.

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "android/**"
      - "app/**"
      - "scripts/build-ffmpeg-android.sh"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  ffmpeg:
    name: ffmpeg (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache the built binaries
        id: cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-out
          # Keyed on the script and on nothing else: the script pins every
          # version it builds, so the same script is the same pair of binaries.
          key: ffmpeg-android-arm64-${{ hashFiles('scripts/build-ffmpeg-android.sh') }}

      - name: Restore whatever the last attempt got through
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .ffmpeg-build
          # Half an hour of compiling should not be repeated because the step
          # after it failed. The script skips each library whose `.a` is already
          # installed, so a resumed run starts where the last one stopped — and
          # the script's own hash is in the key, so editing a configure line
          # starts from nothing rather than keeping what those flags built.
          key: ffmpeg-work-${{ hashFiles('scripts/build-ffmpeg-android.sh') }}-${{ github.run_number }}
          restore-keys: ffmpeg-work-${{ hashFiles('scripts/build-ffmpeg-android.sh') }}-

      - name: Build tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config nasm yasm

      - name: Build
        id: build
        if: steps.cache.outputs.cache-hit != 'true'
        # Read from the process environment, not the `env` context: the NDK path
        # is set by the runner image, and the `env` context only holds what a
        # workflow put there itself.
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-$ANDROID_NDK_HOME}}"
          echo "NDK: $ANDROID_NDK_HOME"
          scripts/build-ffmpeg-android.sh ffmpeg-out

      - name: Keep the progress even if the build failed
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ffmpeg-build
          key: ffmpeg-work-${{ hashFiles('scripts/build-ffmpeg-android.sh') }}-${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-arm64-v8a
          path: ffmpeg-out/*.so
          retention-days: 7

  apk:
    name: APK
    needs: ffmpeg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-arm64-v8a
          # `lib*.so` in the package's library folder is the only place Android
          # will execute a binary from, which is why ffmpeg is packaged as one.
          path: android/app/src/main/jniLibs/arm64-v8a

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # Named explicitly because the action's default list still asks for
          # `tools`, a package Google removed years ago — sdkmanager exits 1 on
          # it and the job dies before Gradle is ever reached. These three are
          # what this build actually compiles against.
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Cache Chaquopy's wheels
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/chaquopy
          key: chaquopy-${{ hashFiles('android/app/build.gradle') }}
          restore-keys: chaquopy-

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build
        working-directory: android
        # Debug, not release: the debug key is what makes the file installable
        # at all, and it is the same key on every run, so one build upgrades the
        # one before it instead of having to be uninstalled first.
        run: gradle --no-daemon assembleDebug

      - name: Check what is actually in it
        # A green build says the project compiled. It does not say Chaquopy
        # found an Android wheel for Pillow, or that pip resolved pydantic 1
        # rather than quietly pulling 2, or that the ffmpeg binaries landed
        # where Android will execute them. Each of those fails at run time, on
        # a phone, with nothing in this log — so they are asserted here.
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          python3 - "$apk" <<'CHECK'
          import io, sys, zipfile

          apk = zipfile.ZipFile(sys.argv[1])
          names = set(apk.namelist())

          required = [
              # Executable only from here, which is the whole reason for the name.
              "lib/arm64-v8a/libffmpeg.so",
              "lib/arm64-v8a/libffprobe.so",
              # The app itself, unpacked to real files on first run.
              "assets/sarideo-python.zip",
              "assets/sarideo-python.version",
              # libass has no font database to ask on a phone.
              "assets/fonts/DejaVuSans.ttf",
          ]
          missing = [name for name in required if name not in names]
          if missing:
              sys.exit("missing from the APK:\n  " + "\n  ".join(missing))

          # The Python package the phone runs, checked for the two files whose
          # absence would leave the app serving nothing.
          payload = zipfile.ZipFile(io.BytesIO(apk.read("assets/sarideo-python.zip")))
          inside = set(payload.namelist())
          for name in ("app/main.py", "app/static/index.html", "app/render/video.py"):
              if name not in inside:
                  sys.exit(f"the Python payload has no {name}")

          # What pip actually installed, as Chaquopy stored it.
          wheels = sorted(n for n in names
                          if n.startswith("assets/chaquopy/requirements"))
          if not wheels:
              sys.exit("Chaquopy installed no requirements at all")

          found = set()
          for wheel in wheels:
              for entry in zipfile.ZipFile(apk.open(wheel)).namelist():
                  top = entry.split("/")[0]
                  if top.endswith(".dist-info"):
                      found.add(top[: -len(".dist-info")])

          print("installed:")
          for name in sorted(found):
              print("  " + name)

          def need(prefix, why):
              hit = [f for f in found if f.lower().startswith(prefix.lower())]
              if not hit:
                  sys.exit(f"{prefix} is not in the APK — {why}")
              return hit[0]

          pydantic = need("pydantic-", "the models cannot load without it")
          if not pydantic.startswith("pydantic-1."):
              sys.exit(f"expected pydantic 1.x on Android, got {pydantic}")
          if any(f.startswith("pydantic_core-") for f in found):
              sys.exit("pydantic-core was installed; that has no Android build")

          need("fastapi-", "there is no server without it")
          need("uvicorn-", "there is nothing to run the server")
          need("pillow-", "no scene image can be prepared")
          need("httpx-", "no provider can be called")

          print()
          print(f"APK entries: {len(names)}")
          for name in required:
              print(f"  {apk.getinfo(name).file_size / 1e6:7.1f} MB  {name}")
          CHECK

      - name: Name it
        id: name
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/sarideo-${GITHUB_SHA::7}.apk"
          ls -lh dist
          echo "apk=dist/sarideo-${GITHUB_SHA::7}.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: sarideo-apk
          path: dist/*.apk
          retention-days: 30
