# Chaquopy unpacks and re-zips every wheel it installs, and Pillow alone is large
# enough that the default heap turns the build into a long garbage collection.
org.gradle.jvmargs=-Xmx4608m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
